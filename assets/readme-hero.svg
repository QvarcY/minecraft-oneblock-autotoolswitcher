<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Minecraft OneBlock AutoToolSwitcher</title>
<desc id="desc">A dark pixel-inspired banner showing a OneBlock cube, hotbar tools, and automatic tool switching.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090d14"/>
    <stop offset="0.55" stop-color="#0c1420"/>
    <stop offset="1" stop-color="#071319"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#78fff2"/>
    <stop offset="0.45" stop-color="#18dcc7"/>
    <stop offset="1" stop-color="#06a998"/>
  </linearGradient>
  <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a5adb7"/>
    <stop offset="1" stop-color="#76808d"/>
  </linearGradient>
  <linearGradient id="stoneFront" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#646e79"/>
    <stop offset="1" stop-color="#39424d"/>
  </linearGradient>
  <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4d5864"/>
    <stop offset="1" stop-color="#2a323a"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#1ce4d1" stop-opacity=".24"/>
    <stop offset="1" stop-color="#1ce4d1" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#4fffe8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="pixels" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#fff" opacity=".025"/>
    <rect x="8" y="8" width="8" height="8" fill="#fff" opacity=".018"/>
  </pattern>
  <clipPath id="rightClip"><rect x="870" y="0" width="730" height="720"/></clipPath>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/>
<rect width="1600" height="720" fill="url(#pixels)"/>
<rect x="850" width="750" height="720" fill="url(#grid)"/>
<ellipse cx="1220" cy="340" rx="500" ry="410" fill="url(#glow)"/>
<g clip-path="url(#rightClip)" fill="none" stroke-linecap="square">
